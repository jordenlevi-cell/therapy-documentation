<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחולל תיעוד טיפולי</title><style>:root{font-family:system-ui,Arial;background:#f5f5fb;color:#24253c}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}h1{margin-bottom:4px}p{line-height:1.6}.muted{color:#60647c}.card{background:white;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 3px 18px #20203b12}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #c9cadd;border-radius:9px;background:white}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#6256c9;color:white;font-weight:700}button.secondary{background:#e9e8f8;color:#3d368b}button.danger{background:#fff0f0;color:#a33}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkrow{display:flex;flex-wrap:wrap;gap:8px}.checkrow label{margin:0;font-weight:400;background:#f1f0fa;padding:8px;border-radius:9px}.checkrow input{width:auto}.taskhead{display:flex;align-items:center;justify-content:space-between;gap:12px}#output{min-height:230px;line-height:1.85}.badge{font-size:13px;background:#eeeafa;padding:5px 9px;border-radius:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:12px}.card{padding:15px}}</style></head><body><main><h1>📝 מחולל תיעוד טיפולי</h1><p class="muted">תיעוד לפי רצף המטלות • ללא שמירת פרטי מטופל • הפקה ועריכה לפני העתקה</p><section id="tasks"></section><div class="actions"><button id="add">＋ הוספת מטלה</button><button id="generate" class="secondary">✨ הפקת תיעוד</button></div><section class="card"><h2>התיעוד שלך <span class="badge">ניתן לעריכה</span></h2><textarea id="output" placeholder="לאחר מילוי המטלות לחצי על הפקת תיעוד"></textarea><div class="actions"><button id="copy">📋 העתקת תיעוד</button><button id="reset" class="danger">טיפול חדש — איפוס</button></div><p id="status" class="muted" role="status"></p></section><p class="muted" style="font-size:13px">העיבוד מתבצע בדפדפן בלבד. אין בטופס חיבור לשרת או שמירה מקומית. מומלץ להימנע מהזנת פרטים מזהים, ולהשתמש רק בהתאם להנחיות המסגרת.</p></main><script>
const domains={"שפה":["הרחבת אוצר מילים","שליפה ושיום","ארגון סמנטי","מורפולוגיה ונטיות","תחביר והרחבת מבע","הבנת שאלות","הבנת הוראות","זיכרון שמיעתי","אחר"],"היגוי":["הפקת הגה בבידוד","הפקת הגה בהברות","הפקת הגה במילים","הפקת הגה במשפטים","הכללה לדיבור ספונטני","מובנות דיבור","אחר"],"תקשורת":["יוזמה תקשורתית","הדדיות ושמירה על תור","שמירה על נושא שיחה","התאמת מסר לנמען","הבנת מצבים חברתיים","זיהוי רגשות וכוונות","אחר"],"נרטיב ושיח":["תיאור רצף פעולות","ארגון סיפור","קשרי סיבה ותוצאה","שימוש במילות קישור","ארגון מסר","מסירת מידע רלוונטי","אחר"],"שטף וקול":["ויסות קצב דיבור","ויסות עוצמת קול","מודעות לדיבור","אחר"],"אחר":["אחר"]};
const prompts=['משחק מובנה','משחק חופשי','משחק קופסה','כרטיסיות/תמונות','סיפור','משחק דיגיטלי','שיחה','פעילות תנועה'];
const supports=['הדגמה','רמז מילולי','רמז חזותי','רמז סמנטי','רמז פונולוגי','שאלות מכוונות','חזרה על ההוראה','פירוק המטלה לשלבים','בחירה בין אפשרויות','תבנית משפט'];
let counter=0;const tasks=document.querySelector('#tasks');
function opts(a,placeholder='בחרי'){return `<option value="">${placeholder}</option>`+a.map(v=>`<option>${v}</option>`).join('')}
function addTask(){let n=++counter;const el=document.createElement('section');el.className='card task';el.innerHTML=`<div class="taskhead"><h2>מטלה <span class="number"></span></h2><button class="danger remove" type="button">הסרה</button></div><div class="grid"><div><label>תחום טיפולי</label><select class="domain">${opts(Object.keys(domains))}</select></div><div><label>מטרה</label><select class="goal"><option>בחרי תחום תחילה</option></select></div></div><label>מטרה מדויקת / ניסוח חופשי (אופציונלי)</label><input class="customGoal" placeholder="למשל: התאמת מין בין שם עצם לתואר"><label>אמצעי טיפול</label><div class="checkrow">${prompts.map(p=>`<label><input type="checkbox" name="activity-${n}" value="${p}"> ${p}</label>`).join('')}</div><input class="activityOther" style="margin-top:8px" placeholder="שם המשחק או פעילות נוספת"><label>דרישת המטלה — מה התבקש לעשות?</label><textarea class="demand" placeholder="למשל: לתאר תמונות באמצעות צירוף שם עצם ותואר"></textarea><div class="grid"><div><label>רמת הצלחה</label><select class="success">${opts(['הצלחה עצמאית','הצלחה במרבית ההתנסויות','הצלחה חלקית','הצלחה מועטה','ללא הצלחה'])}</select></div><div><label>אחוז הצלחה משוער (אופציונלי)</label><select class="percent">${opts(Array.from({length:11},(_,i)=>`${i*10}%`),'לא צוין')}</select></div></div><label>נקודות חוזק / מה הצליח?</label><textarea class="strength" placeholder="תיאור איכותני קצר"></textarea><label>קשיים ודפוסי שגיאה</label><textarea class="difficulty" placeholder="למשל: התקשה בהתאמת מין בין שם העצם לתואר"></textarea><label>דוגמה להפקה (אופציונלי)</label><input class="example" placeholder='למשל: "ילדה קטן" במקום "ילדה קטנה"'><label>תיווכים שניתנו</label><div class="checkrow">${supports.map(p=>`<label><input type="checkbox" name="support-${n}" value="${p}"> ${p}</label>`).join('')}</div><input class="supportOther" style="margin-top:8px" placeholder="תיווך נוסף"><div class="grid"><div><label>מידת התיווך</label><select class="level">${opts(['ללא תיווך','תיווך קל','תיווך בינוני','תיווך רב'])}</select></div><div><label>יעילות התיווך</label><select class="effective">${opts(['סייע','סייע חלקית','לא סייע'])}</select></div></div><label>הערות נוספות</label><textarea class="notes" placeholder="למשל: שינוי ביחס למפגש קודם, קשב או השתתפות"></textarea>`;tasks.append(el);el.querySelector('.domain').addEventListener('change',e=>{el.querySelector('.goal').innerHTML=opts(domains[e.target.value]||[])});el.querySelector('.remove').onclick=()=>{el.remove();renumber()};renumber()}
function renumber(){document.querySelectorAll('.task .number').forEach((e,i)=>e.textContent=i+1)}
function val(el,sel){return el.querySelector(sel)?.value.trim()||''}function checked(el,prefix){return [...el.querySelectorAll(`input[name^="${prefix}"]:checked`)].map(x=>x.value)}function joinHeb(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' ו'+a.at(-1)}
function sentence(s){return s?(/[.!?]$/.test(s)?s:s+'.'):''}
function generate(){const paragraphs=[...document.querySelectorAll('.task')].map((el,i)=>{const domain=val(el,'.domain'),goal=val(el,'.customGoal')||val(el,'.goal');const activities=[...checked(el,'activity-'),val(el,'.activityOther')].filter(Boolean);const demand=val(el,'.demand'),success=val(el,'.success'),percent=val(el,'.percent'),strength=val(el,'.strength'),difficulty=val(el,'.difficulty'),example=val(el,'.example');const help=[...checked(el,'support-'),val(el,'.supportOther')].filter(Boolean),level=val(el,'.level'),effect=val(el,'.effective'),notes=val(el,'.notes');let out=[];if(goal||domain||activities.length){let s=(i===0?'במהלך המפגש ':'בהמשך ');s+='עבדנו '+(goal?'על '+goal:domain?'בתחום '+domain:'בפעילות טיפולית');if(activities.length)s+=' באמצעות '+joinHeb(activities);out.push(sentence(s))}if(demand)out.push(sentence('במסגרת המטלה התבקש/ה '+demand));if(success||percent){let s='רמת הביצוע: '+[success,percent?`כ-${percent} הצלחה (הערכה)`:null].filter(Boolean).join('; ');out.push(sentence(s))}if(strength)out.push(sentence('ניכר כי '+strength));if(difficulty)out.push(sentence('נצפה קושי: '+difficulty));if(example)out.push(sentence('לדוגמה: '+example));if(help.length||level){let s='ניתן '+(level||'תיווך')+(help.length?' באמצעות '+joinHeb(help):'');if(effect)s+=', אשר '+({'סייע':'סייע לביצוע','סייע חלקית':'סייע באופן חלקי','לא סייע':'לא הביא לשיפור ניכר'}[effect]);out.push(sentence(s))}if(notes)out.push(sentence(notes));return out.join(' ')}).filter(Boolean);document.querySelector('#output').value=paragraphs.join('\n\n');document.querySelector('#status').textContent=paragraphs.length?'אפשר לערוך את הנוסח לפני ההעתקה.':'יש למלא לפחות שדה אחד.'}
document.querySelector('#add').onclick=addTask;document.querySelector('#generate').onclick=generate;document.querySelector('#copy').onclick=async()=>{const t=document.querySelector('#output');try{await navigator.clipboard.writeText(t.value);document.querySelector('#status').textContent='התיעוד הועתק!'}catch{t.select();document.execCommand('copy');document.querySelector('#status').textContent='התיעוד סומן להעתקה.'}};document.querySelector('#reset').onclick=()=>{if(!confirm('לאפס את כל השדות ואת התיעוד?'))return;tasks.replaceChildren();document.querySelector('#output').value='';document.querySelector('#status').textContent='';addTask()};addTask();
</script></body></html>
